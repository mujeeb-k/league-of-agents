<script>
  (function () {
    var c = null;
    try { c = localStorage.getItem('loa.theme'); } catch (e) {}
    var dark = c === 'dark' || (c !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    // Opening a repository (a connect link, or a saved connection): the demo's introduction below never shows,
    // not even before the app starts.
    var conn = null;
    try { conn = localStorage.getItem('loa.conn'); } catch (e) {}
    if (/[#&]t=/.test(location.hash) || conn) document.documentElement.dataset.boot = 'repo';
  })();
</script>

<style>
  /* The demo's introduction as plain HTML, for crawlers and until the app starts; the app then shows the same
     text in the inspector (src/components/Intro.tsx). Where the inspector will be, so nothing jumps. */
  #introStatic { position: fixed; top: 48px; right: 0; width: 316px; box-sizing: border-box; padding: 16px;
    border-left: 1px solid var(--border); border-bottom: 1px solid var(--border); background: var(--panel);
    color: var(--foreground); font: 15px/1.5 'IBM Plex Sans', system-ui, sans-serif; }
  #introStatic h1 { margin: 0; font-size: 18px; line-height: 1.375; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
  #introStatic p { margin: 8px 0 0; font-size: 13px; line-height: 1.625; color: var(--ink2); text-wrap: pretty; }
  #introStatic code { display: block; margin-top: 12px; padding: 8px 12px; border-radius: 8px; background: var(--muted);
    font: 12px 'IBM Plex Mono', ui-monospace, monospace; white-space: nowrap; }
  @media (width < 860px) {
    #introStatic { top: 60px; right: 12px; left: 12px; width: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--popover); }
  }
  [data-boot='repo'] #introStatic { display: none; }
</style>
