<meta name="description" content="See every change your agents make. A map of your repo for Claude Code, Codex and Cursor. Select files or lines, give your agent a task, then review its changes.">
<script>
  (function () {
    var c = null;
    try { c = localStorage.getItem('loa.theme'); } catch (e) {}
    var dark = c === 'dark' || (c !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    // Opening a repository (a connect link, or a saved connection): the demo's introduction below never shows,
    // not even before the app starts.
    var conn = null;
    try { conn = localStorage.getItem('loa.conn'); } catch (e) {}
    if (/[#&]t=/.test(location.hash) || conn) document.documentElement.dataset.boot = 'repo';
    // The app opens in the person's language (i18n/index.ts preferredLang): when that isn't this page's, the
    // introduction below waits for the app rather than show first in another language.
    var langs = ['en', 'zh-CN', 'fr', 'pt-BR', 'es'];
    var match = function (s, base) {
      s = String(s || '').toLowerCase();
      for (var i = 0; i < langs.length; i++) {
        var l = langs[i].toLowerCase();
        if (l === s || (base && l.split('-')[0] === s.split('-')[0])) return langs[i];
      }
      return null;
    };
    var want = match(location.pathname.split('/')[1]), saved = null;
    try { saved = localStorage.getItem('loa.lang'); } catch (e) {}
    want = want || match(saved);
    var asked = navigator.languages || [navigator.language];
    for (var j = 0; !want && j < asked.length; j++) want = match(asked[j]) || match(asked[j], true);
    if ((want || 'en') !== document.documentElement.lang) document.documentElement.dataset.intro = 'later';
  })();
</script>

<style>
  /* The demo's introduction as plain HTML, for crawlers and until the app starts; the app then shows the same
     text in the inspector (src/components/Intro.tsx). Where the inspector will be, so nothing jumps. */
  #introStatic { position: fixed; top: 48px; right: 0; width: 316px; box-sizing: border-box; padding: 16px;
    border-left: 1px solid var(--border); border-bottom: 1px solid var(--border); background: var(--panel);

  #introStatic h1 { margin: 0; font-size: 18px; line-height: 1.375; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
  #introStatic .translation { margin: 4px 0 0; font-size: 13px; line-height: 1.45; color: var(--muted-foreground); text-wrap: wrap; }
  #introStatic p { margin: 8px 0 0; font-size: 13px; line-height: 1.625; color: var(--ink2); text-wrap: pretty; }
  /* As tall as the app's copy box, its button included, so the introduction keeps its height when the app starts. */
  #introStatic code { display: block; margin-top: 12px; padding: 0 12px; border-radius: 8px; background: var(--muted);
    font: 12px/40px 'IBM Plex Mono', ui-monospace, monospace; white-space: nowrap; }
  @media (width < 860px) {
    #introStatic { top: 60px; right: 12px; left: 12px; width: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--popover); }
  }
  :lang(zh) #introStatic { font-family: 'IBM Plex Sans', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif; }
  [data-boot='repo'] #introStatic, [data-intro='later'] #introStatic { display: none; }
