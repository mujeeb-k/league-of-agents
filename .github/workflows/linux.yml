# The test suite on Linux: format, lint, types and unit tests, the build, then every interaction and live
# end-to-end test (the bridge with stand-in agents, in real git repos), with no network but the machine's own.
# The visual baselines are macOS renders and stay on the Mac; the perf suite is run by hand.
name: Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The oldest Node the package supports (package.json engines).
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm --prefix web ci
      - run: npx --prefix web playwright install --with-deps chromium firefox
      - run: npm --prefix web run check
      - run: npm --prefix web run build
      # The published bridges some live tests run against, fetched while there is a network.
      - run: |
          for v in 0.1.2 0.1.3; do
            npm install --prefix web/test-results/bridges/$v --no-audit --no-fund leagueofagents-cli@$v
          done
      # With the network cut off: a network namespace that holds only this machine's own loopback. The bridge and
      # the app say they need nothing else, so every test must pass without it. The first command shows the cut
      # holds.
      - run: |
          sudo unshare --net sh -c '
            ip link set lo up
            exec sudo -u "$1" env "PATH=$2" "HOME=$3" CI=true sh -c "
              if curl -sS -m 5 -o /dev/null https://registry.npmjs.org; then echo the network is reachable; exit 1; fi
              npx playwright test --project app --project live --project firefox"
          ' sh "$USER" "$PATH" "$HOME"
        working-directory: web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: web/test-results/
          retention-days: 7
