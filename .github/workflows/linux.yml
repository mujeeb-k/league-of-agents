# The test suite on Linux: format, lint, types and unit tests, the build, then every interaction and live
# end-to-end test (the bridge with stand-in agents, in real git repos). The visual baselines are macOS renders
# and stay on the Mac; the perf suite is run by hand.
name: Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The oldest Node the package supports (package.json engines).
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm --prefix web ci
      - run: npx --prefix web playwright install --with-deps chromium
      - run: npm --prefix web run check
      - run: npm --prefix web run build
      - run: npx playwright test --project app --project live
        working-directory: web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: web/test-results/
          retention-days: 7
