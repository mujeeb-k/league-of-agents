# Daily archive of the repository's traffic, stars and forks, and the npm package's downloads, into the
# private repository mujeeb-k/loa-metrics. Nothing it collects is committed here, and its log prints no numbers.
# Needs two repository secrets, each a fine-grained token covering one repository:
#   TRAFFIC_TOKEN  fine-grained token for this repository, Administration: read
#   METRICS_TOKEN  fine-grained token for mujeeb-k/loa-metrics, Contents: read and write
name: Traffic archive

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: traffic-archive
  cancel-in-progress: false

jobs:
  archive:
    # Only the public repository; never a fork or a copy.
    if: github.repository == 'mujeeb-k/league-of-agents'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/traffic
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: mujeeb-k/loa-metrics
          token: ${{ secrets.METRICS_TOKEN }}
          path: metrics
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch
        run: node .github/traffic/archive.mjs metrics
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          REPO: ${{ github.repository }}
          NPM_PACKAGE: leagueofagents-cli
      - name: Save
        working-directory: metrics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -qm "Traffic for $(date -u +%F)"
          git push -q
